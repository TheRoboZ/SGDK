plugins {
    id 'java'
}

group = 'sgdk.tools'
version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':commons')
    implementation project(':rescomp')
}

tasks.register('extJar', Jar) {
    archiveFileName.set('spriteengine_ext.jar')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn classes

    destinationDirectory.set(layout.projectDirectory)
    from(sourceSets.main.output)
    manifest {
        attributes('Implementation-Title': 'rescomp-extension-spriteengine')
    }
}
